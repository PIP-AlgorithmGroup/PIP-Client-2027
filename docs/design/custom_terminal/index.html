    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      privateContent: null,

    postToHost(&quot;height&quot;, {

    #terminal-redraw { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; line-height: 0; }
    #terminal-redraw * { box-sizing: border-box; }
    #terminal-redraw .hud-screen {
        --own: #246ccb; --opponent: #d63232; --ink: #f7fafc; --secondary: #d2dce1;
        position: absolute; top: 0; left: 0; width: 2560px; height: 1440px; overflow: hidden; isolation: isolate;
        background: #33434c; color: var(--ink); transform-origin: top left;
        font: 25.3334px/1.25 &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif;
        text-shadow: 0 0 6.4px #ffffff30, 0 1.6px 3.2px #07151fd9, 0 0 11.2px #07151f80;
    }
    #terminal-redraw .video-surface { position: absolute; inset: 0; z-index: -1; }
    #terminal-redraw .video-surface &gt; svg { display: block; width: 100%; height: 100%; object-fit: cover; }
    #terminal-redraw .video-surface::after { content: &quot;&quot;; position: absolute; inset: 0; background: linear-gradient(#07131d3d, transparent 35%, #07131d26 80%, #07131d55); }
    #terminal-redraw button { font: inherit; color: inherit; text-shadow: inherit; }
    #terminal-redraw b { font-weight: 700; }
    /* 敌我分组固定左右；采用草图第一版的上排与中央留白，不随阵营换位。 */
    #terminal-redraw .match-top { position: absolute; top: 13.3333px; left: 53.3333px; right: 53.3333px; display: grid; grid-template-columns: 1fr 260px 1fr; align-items: start; gap: 32px; }
    #terminal-redraw .roster { display: grid; grid-template-columns: repeat(4, 170.6667px); gap: 42.6667px; }
    #terminal-redraw .roster.opponent { justify-content: end; }
    #terminal-redraw .robot { --team: var(--own); position: relative; isolation: isolate; display: grid; grid-template-rows: 72px 152px; width: 170.6667px; padding: 0; border: 0; border-radius: 0; background: #0e1d2980; text-align: left; }
    #terminal-redraw .opponent .robot { --team: var(--opponent); }
    #terminal-redraw .robot:disabled { opacity: 1; }

    /** 2560×1440 为设计画布；画布绝对定位，外层用 16:9 比例占位，避免原始高度撑出空白。 */

        root.querySelector(&quot;.target-track.temperature i&quot;).style.width = `${target.heat}%`;

    function renderMap() {
        const markers = [
            [false, &quot;heavy&quot;, 19, 77], [false, &quot;infantry_3&quot;, 50, 80], [false, &quot;infantry_4&quot;, 35, 60], [false, &quot;sentry&quot;, 15, 46],
            [true, &quot;heavy&quot;, 78, 26], [true, &quot;infantry_3&quot;, 63, 41], [true, &quot;infantry_4&quot;, 78, 61], [true, &quot;sentry&quot;, 88, 34],
        ];
        root.querySelector(&quot;.map-units&quot;).innerHTML = markers.map(([is_opponent, kind, x, y]) =&gt; {
            const color = is_opponent ? opponentColor() : state.ownColor;
            const unit = (is_opponent ? opponent_units : own_units).find(candidate =&gt; candidate.kind === kind);
            return `&lt;img class=&quot;map-unit ${!is_opponent &amp;&amp; kind === state.selfKind ? &quot;current&quot; : &quot;&quot;} ${unit.hp === 0 ? &quot;is-dead&quot; : &quot;&quot;}&quot; src=&quot;${assets.compact[`${color}_${kind}`]}&quot; style=&quot;left:${x}%;top:${y}%&quot; alt=&quot;${is_opponent ? &quot;敌方&quot; : &quot;己方&quot;}${unit.name}&quot;&gt;`;
        }).join(&quot;&quot;);
    }
    /** 恢复本地有效夹具的静态结构，保证多次切换不会把占位符写回最后有效数据。 */
    function restoreDataPresentation() {
        root.querySelectorAll(&quot;.is-missing, .data-stale, .is-unavailable&quot;).forEach(element =&gt; {
            element.classList.remove(&quot;is-missing&quot;, &quot;data-stale&quot;, &quot;is-unavailable&quot;);
            delete element.dataset.quality;
            element.removeAttribute(&quot;data-tooltip&quot;);
        });
        for (const entry of static_templates) {
            entry.element.innerHTML = entry.html;
            entry.element.setAttribute(&quot;aria-label&quot;, entry.label);
        }
        for (const [element, label] of initial_aria_labels) {
            if (label === null) element.removeAttribute(&quot;aria-label&quot;);

        }
        root.querySelector(&quot;.self-rank&quot;).hidden = false;

        root.querySelector(&quot;.map-data-note&quot;).hidden = true;
        screen.dataset.scenario = state.dataScenario;
    }
    /** 未接入是未知，不代表0、死亡或离线；文字说明同时供辅助技术读取。 */
    function unknownValue(element, placeholder = &quot;—&quot;, reason = &quot;未收到数据&quot;) {
        element.textContent = placeholder;
        element.classList.add(&quot;is-missing&quot;);
        element.dataset.quality = &quot;missing&quot;;
        element.setAttribute(&quot;aria-label&quot;, reason);
    }
    /** 斜纹轨道没有进度量；不按0%绘制，以免与真实空槽混淆。 */
    function unknownTrack(element, reason = &quot;未收到数据&quot;) {
        element.classList.add(&quot;is-missing&quot;);
        element.dataset.quality = &quot;missing&quot;;
        element.setAttribute(&quot;aria-label&quot;, reason);
    }
    /** 单位保持原有辅助字号，避免未知占位符把单位提升为主数值。 */
    function unknownUnitValue(element, unit) {
        unknownValue(element);
        const small = document.createElement(&quot;small&quot;);
        small.textContent = unit;
        element.append(&quot; &quot;, small);
    }
    /** 字段级覆盖用于评审局部缺失；非法值与缺失同样无进度，但必须保留不同的原因标记。 */
    function renderFieldQuality() {
        const bindings = {
            heat: { value: &quot;.heat-reading b&quot;, track: &quot;.heat-meter&quot;, placeholder: &quot;—&quot; },
            capacitor: { value: &quot;.resource-row &gt; div:last-child b&quot;, track: &quot;.capacitor-track&quot;, placeholder: &quot;— %&quot; },
            power: { value: &quot;.power-row &gt; b&quot;, track: &quot;.power-track&quot;, placeholder: &quot;— W&quot; },
            selfHp: { value: &quot;.dashboard-hp &gt; b&quot;, track: &quot;.dashboard-hp&quot;, placeholder: &quot;— / —&quot; },
            targetHp: { value: &quot;.target-health&quot;, track: &quot;.target-track.health&quot;, placeholder: &quot;— / —&quot; },
        };
        for (const [name, quality] of Object.entries(state.fieldQuality)) {
            const binding = bindings[name];
            if (!binding || ![&quot;missing&quot;, &quot;invalid&quot;, &quot;unavailable&quot;].includes(quality)) continue;
            const reason = quality === &quot;invalid&quot; ? &quot;数据异常，当前值不可用&quot; : (quality === &quot;unavailable&quot; ? &quot;已确认不适用&quot; : &quot;未收到数据&quot;);
            const value = root.querySelector(binding.value);
            const track = root.querySelector(binding.track);
            unknownValue(value, quality === &quot;unavailable&quot; ? &quot;N/A&quot; : binding.placeholder, reason);
            unknownTrack(track, reason);
            value.dataset.quality = quality;
            track.dataset.quality = quality;
            if (quality === &quot;invalid&quot;) value.setAttribute(&quot;data-tooltip&quot;, reason);
            if (name === &quot;selfHp&quot;) {
                const card = root.querySelector(&quot;.roster.own .robot.is-self&quot;);
                card.classList.remove(&quot;is-dead&quot;);
                card.classList.add(&quot;is-missing&quot;);
                card.querySelector(&quot;.robot-fill&quot;)?.remove();
                unknownValue(card.querySelector(&quot;.robot-health&quot;), binding.placeholder, reason);
                card.setAttribute(&quot;aria-label&quot;, `本人，${card.querySelector(&quot;.robot-name&quot;).textContent}，${reason}`);
            }
            if (name === &quot;targetHp&quot;) {
                root.querySelector(&quot;.target&quot;).classList.remove(&quot;is-dead&quot;);
                const target = opponent_units.find(unit =&gt; unit.kind === target_kind);
                root.querySelector(&quot;.target-level&quot;).textContent = `LV.${target.level}`;
            }
        }
        if (Object.keys(state.fieldQuality).length &amp;&amp; state.dataScenario === &quot;live&quot;) {
            const notice = root.querySelector(&quot;.data-notice&quot;);
            notice.hidden = false;
            notice.textContent = Object.values(state.fieldQuality).includes(&quot;invalid&quot;) ? &quot;部分数据异常&quot; : &quot;部分数据不可用&quot;;
        }
    }
    /** 顶部未知HP保留阵营图标与本人标记，取消死亡结论及其灰白整卡底色。 */
    function unknownRoster(selector) {
        root.querySelectorAll(`${selector} .robot`).forEach(card =&gt; {
            card.classList.remove(&quot;is-dead&quot;);
            card.classList.add(&quot;is-missing&quot;);
            card.querySelector(&quot;.robot-fill&quot;)?.remove();
            unknownValue(card.querySelector(&quot;.robot-health&quot;), &quot;— / —&quot;, &quot;血量和上限未收到&quot;);
            unknownValue(card.querySelector(&quot;.robot-ammo b&quot;), &quot;—&quot;, &quot;弹量未收到&quot;);
            unknownValue(card.querySelector(&quot;.robot-level&quot;), &quot;LV.—&quot;, &quot;等级未收到&quot;);
            card.setAttribute(&quot;aria-label&quot;, `${card.closest(&quot;.own&quot;) ? &quot;己方&quot; : &quot;敌方&quot;}${card.querySelector(&quot;.robot-name&quot;).textContent}，数据未收到`);

    /** 未知目标与确认无目标使用不同文案，均不保留虚构的预选敌方身份或锁定结果。 */
    function unknownTarget(is_confirmed_empty = false) {
        const target = root.querySelector(&quot;.target&quot;);

        target.classList.add(&quot;is-missing&quot;);

        target.querySelector(&quot;.target-level&quot;).textContent = is_confirmed_empty ? &quot;无目标&quot; : &quot;未接入&quot;;

        target.querySelectorAll(&quot;.target-track&quot;).forEach(track =&gt; unknownTrack(track));
        root.querySelectorAll(&quot;.opponent .robot&quot;).forEach(card =&gt; card.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;));

    }
    /** 关闭表示确定状态的官方脱战图标；无图标的数据源不能显示默认握手或默认交战。 */
    function unknownCombat(reason = &quot;脱战未知&quot;) {
        const status = root.querySelector(&quot;.combat-status&quot;);

    }
    /** 未接入与离线共用红灯；保留状态原因，红灯不推断具体设备故障。 */
    function unknownModules() {
        const modules = root.querySelector(&quot;.module-status&quot;);
        modules.setAttribute(&quot;aria-label&quot;, &quot;模块遥测未接入，各模块状态未知&quot;);
        modules.querySelectorAll(&quot;span&quot;).forEach(module =&gt; {
            module.classList.add(&quot;is-missing&quot;);
            module.setAttribute(&quot;aria-label&quot;, `${module.textContent}，状态未知`);
        });
    }
    /** 官方斜灯只表达模块可用性：在线绿灯，离线或无来源红灯，不适用为中性灰灯。 */
    function renderModuleLamps() {
        root.querySelectorAll(&quot;.module-status &gt; span&quot;).forEach(module =&gt; {
            const is_unavailable = module.classList.contains(&quot;is-unavailable&quot;);
            const is_offline = module.classList.contains(&quot;is-missing&quot;) || module.dataset.state === &quot;offline&quot;;
            const image = document.createElement(&quot;img&quot;);
            image.className = &quot;module-lamp&quot;;
            image.alt = &quot;&quot;;
            image.src = official_module_lamps[is_offline ? &quot;red&quot; : &quot;green&quot;];
            image.dataset.lamp = is_unavailable ? &quot;unavailable&quot; : (is_offline ? &quot;red&quot; : &quot;green&quot;);
            module.prepend(image);
            if (module.dataset.state === &quot;offline&quot;) module.setAttribute(&quot;aria-label&quot;, `${module.textContent}，离线`);
        });
    }
    /** 无位置数据时只保留已知静态地图，不把预置点位、视野方向或自车位置当作实测。 */
    function unknownPositions(text = &quot;位置未接入&quot;) {

    }
    /** 无数据全景：单位和静态身份保留，数值/条形/状态按各自语义降级。 */
    function renderEmptyData() {

        unknownTrack(root.querySelector(&quot;.heat-meter&quot;));
        root.querySelector(&quot;.heat-meter&quot;).setAttribute(&quot;aria-label&quot;, &quot;枪口热量未收到，双弧没有有效进度&quot;);
        unknownValue(root.querySelector(&quot;.heat-reading b&quot;));
        unknownValue(root.querySelector(&quot;.dashboard-hp &gt; b&quot;), &quot;— / —&quot;, &quot;自身血量和上限未收到&quot;);
        unknownTrack(root.querySelector(&quot;.dashboard-hp&quot;));
        unknownValue(root.querySelector(&quot;.power-row &gt; b&quot;), &quot;— W&quot;);
        root.querySelectorAll(&quot;.resource-row b&quot;).forEach((value, index) =&gt; unknownValue(value, index ? &quot;— %&quot; : &quot;— J&quot;));

    /** 仅绘制状态方案，不做协议接收或超时推断；所有场景保持视频与数据质量相互独立。 */
    function renderDataAvailability() {
        const scenario = state.dataScenario;
        const notice = root.querySelector(&quot;.data-notice&quot;);
        const messages = { empty: &quot;等待比赛数据&quot;, partial: &quot;部分数据未接入&quot;, stale: &quot;比赛数据未更新 · 3.2 s&quot;, unavailable: &quot;部分功能不适用&quot; };
        notice.hidden = !messages[scenario];
        notice.textContent = messages[scenario] || &quot;&quot;;
        notice.dataset.quality = scenario;
        if (scenario === &quot;empty&quot;) {
            renderEmptyData();
        } else if (scenario === &quot;partial&quot;) {
            // 例：裁判数据正常，自车热量/超电/模块和敌方信息尚无来源。
            unknownRoster(&quot;.roster.opponent&quot;);
            root.querySelectorAll(&quot;.opponent-economy b&quot;).forEach(value =&gt; unknownValue(value));
            root.querySelector(&quot;.opponent-economy&quot;).setAttribute(&quot;aria-label&quot;, &quot;敌方经济未收到&quot;);
            unknownTrack(root.querySelector(&quot;.heat-meter&quot;));
            unknownValue(root.querySelector(&quot;.heat-reading b&quot;));
            root.querySelector(&quot;.heat-meter&quot;).setAttribute(&quot;aria-label&quot;, &quot;枪口热量未收到&quot;);
            unknownValue(root.querySelector(&quot;.resource-row &gt; div:last-child b&quot;), &quot;— %&quot;);
            unknownTrack(root.querySelector(&quot;.capacitor-track&quot;));
            unknownCombat();
            unknownModules();
            unknownTarget();
            unknownPositions();
        } else if (scenario === &quot;stale&quot;) {
            // 保留最后快照，但瞬态目标、计时器与脱战结论都不能表现为仍在实时运行。
            for (const selector of [&quot;.roster.own&quot;, &quot;.roster.opponent&quot;, &quot;.buildings.own-buildings&quot;, &quot;.buildings.opponent-buildings&quot;, &quot;.economy&quot;, &quot;.robot-dashboard&quot;, &quot;.combat-hud&quot;, &quot;.match-center&quot;]) {

            unknownCombat(&quot;脱战未更新&quot;);
            unknownModules();
            root.querySelector(&quot;.map-units&quot;).classList.add(&quot;data-stale&quot;);
            const note = root.querySelector(&quot;.map-data-note&quot;);
            note.hidden = false;
            note.textContent = &quot;位置未更新 · 3.2 s&quot;;
        } else if (scenario === &quot;unavailable&quot;) {
            // 只有已知能力不支持才使用“不适用”，不能用收不到数据来推断能力。
            const resource = root.querySelector(&quot;.resource-row &gt; div:last-child&quot;);
            unknownTrack(resource.querySelector(&quot;.dashboard-track&quot;), &quot;已确认没有配置超级电容&quot;);
            unknownValue(resource.querySelector(&quot;b&quot;), &quot;N/A&quot;, &quot;超级电容不适用&quot;);
            const module = root.querySelector(&quot;.module-status &gt; span:nth-child(9)&quot;);
            module.classList.add(&quot;is-unavailable&quot;);
            module.setAttribute(&quot;aria-label&quot;, &quot;超级电容，未配置，不适用&quot;);
            unknownCombat(&quot;脱战不适用&quot;);
            unknownTarget(true);
        }
    }
    /** 阵营变化只修改色彩与素材，容器位置保持不变；两个热量弧共用同一数值。 */

        combat_status.querySelector(&quot;span&quot;).textContent = is_engaged ? &quot;5s 后脱战&quot; : &quot;已脱战&quot;;
        const self_unit = own_units.find(unit =&gt; unit.kind === state.selfKind);
        self_unit.level = state.selfLevel;
        screen.style.setProperty(&quot;--own&quot;, colors[state.ownColor]);
        screen.style.setProperty(&quot;--opponent&quot;, colors[opponentColor()]);
        root.querySelector(&quot;.self-role&quot;).src = assets.standard[`${state.ownColor}_${state.selfKind}`];
        root.querySelector(&quot;.self-role&quot;).alt = `己方${self_unit.name}`;
        root.querySelector(&quot;.self-rank&quot;).src = official_levels[`${state.ownColor}_${state.selfLevel}`];
        root.querySelector(&quot;.self-rank&quot;).alt = `${state.selfLevel} 级`;
        // 仅反转顶部显示顺序：己方7/4/3/1，敌方1/3/4/7；保留夹具索引和目标选择语义。
        root.querySelector(&quot;.roster.own&quot;).innerHTML = own_units.slice().reverse().map(unit =&gt; robotMarkup(unit, false)).join(&quot;&quot;);
        root.querySelector(&quot;.roster.opponent&quot;).innerHTML = opponent_units.slice().reverse().map(unit =&gt; robotMarkup(unit, true)).join(&quot;&quot;);
        root.querySelectorAll(&quot;.heat-progress&quot;).forEach(arc =&gt; {
            arc.style.strokeDasharray = `${state.heat} 100`;
            arc.style.stroke = state.heat &gt;= 75 ? &quot;#edc985&quot; : &quot;#f2f6f7&quot;;
        });
        root.querySelector(&quot;.heat-reading b&quot;).textContent = state.heat;
        root.querySelector(&quot;.heat-meter&quot;).setAttribute(&quot;aria-label&quot;, `枪口热量 ${state.heat}%，两侧同步显示`);

    root.querySelector(&quot;.ammo-bars&quot;).innerHTML = &quot;&lt;i&gt;&lt;/i&gt;&quot;.repeat(20);
    // 横条每 5% 设置小刻度、每 10% 设置中刻度、25/50/75% 设置主刻度。
    root.querySelectorAll(&quot;.building-track, .target-track&quot;).forEach(track =&gt; {
        const ticks = document.createElement(&quot;div&quot;);
        ticks.className = &quot;internal-ticks&quot;;
        ticks.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
        for (let percent = 5; percent &lt; 100; percent += 5) {
            const height = percent % 25 === 0 ? 100 : (percent % 10 === 0 ? 65 : 35);
            ticks.insertAdjacentHTML(&quot;beforeend&quot;, `&lt;span style=&quot;left:${percent}%;height:${height}%&quot;&gt;&lt;/span&gt;`);
        }
        track.append(ticks);
    });
    // 热量弧刻度沿同一个 240 半径定位，两侧保持镜像和同一比例。
    let arc_ticks = &quot;&quot;;
    for (let percent = 10; percent &lt; 100; percent += 10) {
        const length = percent === 50 ? 11 : (percent % 20 === 0 ? 7 : 4);
        for (const angle of [145 + percent * .7, 35 - percent * .7]) {
            const radians = angle * Math.PI / 180;
            const inner = 245.5 - length;
            arc_ticks += `&lt;line x1=&quot;${260 + inner * Math.cos(radians)}&quot; y1=&quot;${160 + inner * Math.sin(radians)}&quot; x2=&quot;${260 + 245.5 * Math.cos(radians)}&quot; y2=&quot;${160 + 245.5 * Math.sin(radians)}&quot; stroke=&quot;#07131d&quot; stroke-opacity=&quot;.55&quot; stroke-width=&quot;1.4&quot;/&gt;`;
        }
    }

        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () =&gt; {
        mousePointerId = null;
      };
      const sizePicker = () =&gt; {
        root.style.setProperty(
          &quot;--viz-carousel-picker-height&quot;,
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener(&quot;toggle&quot;, sizePicker);
      window.addEventListener(&quot;resize&quot;, sizePicker);
      document.addEventListener(&quot;pointerdown&quot;, dismiss);
      document.addEventListener(&quot;pointerup&quot;, endPointerSelection);
      document.addEventListener(&quot;pointercancel&quot;, endPointerSelection);
      window.addEventListener(&quot;blur&quot;, endPointerSelection);
      window.addEventListener(
        &quot;pagehide&quot;,
        () =&gt; {
          document.removeEventListener(&quot;pointerdown&quot;, dismiss);
          document.removeEventListener(&quot;pointerup&quot;, endPointerSelection);
          document.removeEventListener(&quot;pointercancel&quot;, endPointerSelection);
          window.removeEventListener(&quot;blur&quot;, endPointerSelection);
          window.removeEventListener(&quot;resize&quot;, sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
&lt;/script&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true

          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });

      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
