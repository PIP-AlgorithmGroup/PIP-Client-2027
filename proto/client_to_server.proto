// RoboMaster 2027 机甲大师高校系列赛通信协议 V1.0.0（20261029），第 2.2 节。
// 方向：自定义终端发送。package 仅用于生成代码，MQTT topic 仍为官方指令名。
syntax = "proto3";

package rm_client_to_server;

// 键鼠输入。Topic：KeyboardMouseControl。终端 → 图传链路 → 机器人，75 Hz，最高 QoS 1。
// 比赛时只可从官方选手端和自定义终端中选择一个键鼠指令来源。
message KeyboardMouseControl {
    optional int32 mouse_x = 1;  // X 轴移动速度，负值向左。
    optional int32 mouse_y = 2;  // Y 轴移动速度，负值向下。
    optional int32 mouse_z = 3;  // 滚轮移动速度，负值向后。
    optional bool left_button_down = 4;  // 左键是否按下。
    optional bool right_button_down = 5;  // 右键是否按下。
    // bit 0–15 对应 W、S、A、D、Shift、Ctrl、Q、E、R、F、G、Z、X、C、V、B；1 为按下。
    optional uint32 keyboard_value = 6;
    optional bool mid_button_down = 7;  // 中键是否按下。
}

// 自定义数据。Topic：CustomControl。终端 → 图传链路 → 机器人，75 Hz，最高 QoS 1。
// 图传命令字为 0x0311，该链路无重传。
message CustomControl {
    optional bytes data = 1;  // 最多 60 字节。
}

// 地图点击标记。Topic：MapClickCmd。终端 → 服务器，触发发送，最高 QoS 1。
// 按 §1.3.1，云台手触发间隔至少 0.5 秒，半自动机器人操作手至少 3 秒。
message MapClickCmd {
    optional uint32 is_send_all = 1;  // 0 指定客户端，1 除哨兵，2 包含哨兵。
    optional bytes robot_id = 2;  // 目标机器人 ID 列表，固定 7 字节，未用尾位填 0。
    optional uint32 mode = 3;  // 1 攻击，2 防御，3 警戒，4 自定义。
    optional uint32 enemy_id = 4;  // 标定的对方机器人 ID。
    optional uint32 ascii = 5;  // 自定义图标，限 mode 为 4；允许 C–L、N、O、Q–Z。
    optional uint32 type = 6;  // 1 标记地图，2 标记对方机器人。
    optional float map_x = 7;  // 地图 X 坐标。
    optional float map_y = 8;  // 地图 Y 坐标。
}

// 重装装配指令。Topic：AssemblyCommand。终端 → 服务器，触发发送，最高 10 Hz、QoS 1。
message AssemblyCommand {
    optional uint32 operation = 1;  // 0 开始兑换，1 确认装配，2 取消装配。
    optional uint32 difficulty = 2;  // 选中的装配难度。
}

// 选择性能体系或控制方式。Topic：RobotPerformanceSelectionCommand。
// 终端 → 服务器，触发发送，最高 10 Hz、QoS 1。
message RobotPerformanceSelectionCommand {
    optional uint32 shooter = 1;  // 1 冷却优先，2 爆发优先。
    optional uint32 chassis = 2;  // 1 血量优先，2 功率优先。
    optional uint32 sentry_control = 3;  // 0 自动，1 半自动。
}

// 能量机关激活。Topic：RuneActivateCommand。终端 → 服务器，触发发送，最高 10 Hz、QoS 1。
message RuneActivateCommand {
    optional uint32 activate = 1;  // 1 开启。
}

// 飞镖控制。Topic：DartCommand。终端 → 服务器，触发发送，最高 10 Hz、QoS 1。
message DartCommand {
    // 1 前哨站，2 基地固定目标，3 随机固定目标，4 随机移动目标，5 末端移动目标。
    optional uint32 target_id = 1;
    optional bool open = 2;  // 闸门开关。
    optional bool launch_confirm = 3;  // 默认 false；true 表示确认发射。
}

// 哨兵控制请求。Topic：SentryCtrlCommand。终端 → 服务器，触发发送，最高 10 Hz、QoS 1。
message SentryCtrlCommand {
    // 0 无效，1 补血点补弹，3 远程补弹，4 远程回血，5 确认复活，6 金币复活；
    // 7–9 切换进攻、防御、移动姿态；10–12 为对应强化姿态。
    optional uint32 command_id = 1;
}

// 常用机器人指令。Topic：CommonCommand。终端 → 服务器，触发发送，最高 10 Hz、QoS 1。
message CommonCommand {
    // 1/2 兑换 17/42 mm 发弹量（金币须足够）；3 确认复活，4 兑换立即复活，
    // 5 远程兑换允许发弹量，6 远程兑换血量。兑换和复活条件见 §2.2.25。
    optional uint32 cmd_type = 1;
    optional uint32 param = 2;  // 命令参数；cmd_type 为 1 时必须是 10 的倍数。
}
